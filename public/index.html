<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mundo da Luize e da Carmel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mundo da Luize">
<meta name="theme-color" content="#ff5fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --card:rgba(255,255,255,.9); --card-solid:#fffafd; --ink:#5a2a7a; --soft:#9a6bb8; --line:#f0d6ef;
  --pink:#ff5fa8; --pink-d:#c23d7f; --gold:#ffc83d; --gold-d:#c9921a; --mint:#3dd6a8; --sky:#9fdcff;
  --chip:#fff0f8; --shadow:0 4px 0 rgba(90,42,122,.22);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(52,28,78,.9);--card-solid:#341c4e;--ink:#ffe6f4;--soft:#d6b3ef;--line:#5b3a7c;--chip:#47285f;color-scheme:dark}}
:root[data-theme="dark"]{--card:rgba(52,28,78,.9);--card-solid:#341c4e;--ink:#ffe6f4;--soft:#d6b3ef;--line:#5b3a7c;--chip:#47285f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:'Baloo 2',ui-rounded,'Segoe UI Rounded',system-ui,sans-serif;color:var(--ink);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#game{position:fixed;inset:0}
#game canvas{display:block}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
.tl{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;max-width:min(360px,46vw);pointer-events:none}
.tl > *{pointer-events:auto}
.title{padding:7px 16px 5px;line-height:1.05}
.title h1{margin:0;font-size:clamp(15px,2.6vw,22px);font-weight:800;color:var(--pink)}
.title p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--soft)}
#missionBox{padding:8px 14px;font-size:14px;line-height:1.25}
#missionBox:empty{display:none}
#missionBox .m{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
#missionBox .m + .m{border-top:2px dashed var(--line);padding-top:6px;margin-top:3px}
#missionBox b{display:block;font-size:14.5px}
#missionBox small{color:var(--soft);font-weight:600}
.tr{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.tr > *{pointer-events:auto}
.counters{display:flex;gap:14px;padding:6px 14px;font-size:21px;font-weight:800;white-space:nowrap}
.counters small{font-size:14px;color:var(--soft)}
.counters .pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.hb{width:46px;height:46px;border:0;border-radius:15px;background:var(--card);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center}
.hb:active{transform:translateY(2px)}
#powers{display:flex;gap:6px}
.pw{background:var(--card);border-radius:14px;padding:3px 9px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);font-weight:800;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #b07800,0 0 12px #fff;pointer-events:none;opacity:0;transition:opacity .3s}
#combo.on{opacity:1}
#mmWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:200px;height:200px;border-radius:50%;padding:6px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
#minimap{width:100%;height:100%;border-radius:50%;display:block}
#mmWrap .lbl{position:absolute;left:50%;bottom:-2px;transform:translate(-50%,0);background:var(--pink);color:#fff;font-size:12px;font-weight:800;padding:0 10px;border-radius:10px;white-space:nowrap}
#actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 226px);border:0;padding:10px 20px;font-weight:800;font-size:17px;color:var(--ink);white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;animation:bob 1.2s ease-in-out infinite}
#actBtn kbd{background:var(--pink);color:#fff;border-radius:8px;padding:0 8px;margin-right:8px;font-family:inherit}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#regionName{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);padding:10px 26px;font-size:clamp(22px,4.5vw,36px);font-weight:800;color:var(--pink);opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
#regionName.show{opacity:1}
#regionName small{display:block;font-size:15px;color:var(--soft)}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.85);padding:12px 24px;font-size:clamp(18px,3.4vw,26px);font-weight:800;color:var(--pink);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;max-width:calc(100vw - 30px);z-index:30}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);visibility:hidden;padding:10px 22px;font-weight:800;font-size:18px;transition:transform .45s cubic-bezier(.2,1.4,.4,1);z-index:31;text-align:center;pointer-events:none}
#banner.show{transform:translate(-50%,0);visibility:visible}
#banner small{display:block;color:var(--soft);font-size:14px}
#joy,#jumpBtn,#runHint{display:none}
#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.75);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--pink);box-shadow:0 4px 0 var(--pink-d)}
#jumpBtn{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:88px;height:88px;border-radius:50%;border:0;background:var(--gold);box-shadow:0 5px 0 var(--gold-d);font-weight:800;font-size:18px;color:#5a2a7a;touch-action:none}
#jumpBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
@media (pointer:coarse){
  #joy,#jumpBtn{display:block}
  #mmWrap{width:128px;height:128px;padding:4px}
  #actBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  .hb{width:42px;height:42px;font-size:20px}
}
#buildBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 226px);display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
@media (pointer:coarse){#buildBar{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}}
.pill{border:0;border-radius:14px;padding:8px 14px;font-weight:800;background:var(--chip);color:var(--ink);box-shadow:0 3px 0 rgba(90,42,122,.18)}
.pill.main{background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--pink-d)}
.pill.gold{background:var(--gold);color:#5a2a7a;box-shadow:0 3px 0 var(--gold-d)}
.pill:disabled{opacity:.45;cursor:default}
.pill:active:not(:disabled){transform:translateY(2px)}
body.modal-open #mmWrap,body.modal-open #actBtn,body.modal-open #joy,body.modal-open #jumpBtn,body.modal-open #buildBar{display:none!important}
/* desafios */
#edu{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(90,42,122,.25)}
#edu .ebox{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--card-solid);border-radius:26px;box-shadow:0 8px 0 rgba(90,42,122,.25),0 24px 60px rgba(90,42,122,.3);animation:popin .3s cubic-bezier(.2,1.4,.4,1);touch-action:pan-y}
@keyframes popin{from{transform:scale(.85);opacity:0}}
#edu .ehead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 20px;color:#fff;font-weight:800;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
#edu .ehead > span:first-child{flex:1}
#edu .dots{display:flex;gap:5px}
#edu .dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4)}
#edu .dot.ok{background:#fff}
#edu .dot.cur{background:#ffd43b;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
#edu .eclose{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.3);color:#fff;font-weight:800}
#edu .ebody{padding:14px 20px 20px;text-align:center}
#edu .ewho{margin:0 0 6px;font-weight:700;color:var(--soft)}
#edu .evis{font-size:clamp(34px,8vw,52px);line-height:1.25;letter-spacing:2px;margin:4px 0 8px;word-break:break-word;font-weight:800;color:var(--ink)}
#edu .eq{font-size:clamp(19px,4vw,24px);font-weight:800;margin:0 0 14px;line-height:1.25}
#edu .esay{border:0;border-radius:50%;width:44px;height:44px;background:var(--chip);font-size:22px;vertical-align:middle;margin-left:4px}
#edu .eopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
#edu .eopts.big{grid-template-columns:repeat(3,1fr)}
#edu .eopt{border:0;border-radius:20px;padding:14px 10px;min-height:64px;font-weight:800;font-size:clamp(18px,3.6vw,22px);background:var(--chip);color:var(--ink);box-shadow:0 4px 0 rgba(90,42,122,.18);transition:transform .1s}
#edu .eopts.big .eopt{font-size:clamp(34px,8vw,46px);min-height:86px}
#edu .eopt:active{transform:translateY(3px)}
#edu .eopt.main{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
#edu .eopt.right{background:#3dd68c;color:#fff;box-shadow:0 4px 0 #1f9e60;animation:pop .4s}
#edu .eopt.wrong{opacity:.45;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#edu .emsg{min-height:26px;margin:12px 0 0;font-weight:800;font-size:18px;color:var(--soft)}
#edu .emsg.good{color:#1f9e60}
#modal .sheet.wide{width:min(960px,calc(100vw - 24px))}
@media (max-width:700px){#modal .sheet.wide{left:0;right:0;top:0;bottom:0;width:auto;height:auto;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#modal .sheet.wide .uni{max-width:none;aspect-ratio:1/1.15}#modal .sheet.wide #mBody{padding:10px 12px 16px}}
.xp{margin:0 0 10px}
.xp b{display:block;font-size:20px;margin-top:6px}
.xp small{color:var(--soft);font-weight:700}
.xpbar{height:16px;border-radius:10px;background:var(--chip);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.xpbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#ff6b6b,#ffd43b,#69db7c,#4dabf7,#b197fc)}
.atlas{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){.atlas{grid-template-columns:1fr}}
.amain canvas{width:100%;border-radius:18px;display:block;box-shadow:0 4px 0 rgba(90,42,122,.15)}
.aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card-solid)}
.acard canvas{width:100%;display:block}
.acard > div{padding:6px 8px 8px;line-height:1.15}
.acard b{display:block;font-size:14px}
.acard small{display:block;font-size:12px;font-weight:700;color:var(--soft)}
.acard small.how{font-weight:600;margin-top:2px;opacity:.85}
/* ===== MOBILE (body.mob) — o desktop não muda ===== */
#mTop,#notif,.mh{display:none}
body.mob #mTop{display:flex;position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);gap:8px;align-items:center;pointer-events:none;z-index:6}
body.mob #mTop > *{pointer-events:auto}
body.mob #mTop .sp{flex:1;pointer-events:none}
.mb{position:relative;min-width:48px;height:48px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:23px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mb:active{transform:translateY(2px)}
.mb .bd{position:absolute;right:-4px;top:-4px;background:#ff5fa8;color:#fff;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:0 5px;line-height:18px;min-width:18px}
.mb .dt{position:absolute;right:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#ff5fa8;box-shadow:0 0 0 2px #fff}
#mRew span{font-size:19px}
body.mob .tl,body.mob .tr,body.mob #mmWrap,body.mob #combo{display:none!important}
body.mob #notif{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:32;pointer-events:none;width:max-content;max-width:80vw}
.nt{background:var(--card-solid);color:var(--ink);font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(90,42,122,.22);opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .25s,transform .25s;text-align:center}
.nt.in{opacity:1;transform:none}
.nt.out{opacity:0;transform:translateY(-8px)}
body.mob #toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);font-size:16px;padding:8px 16px;max-width:86vw}
/* controles */
body.mob #joy{display:block;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:132px;height:132px;opacity:.55;transition:opacity .2s}
body.mob #joy.active{opacity:.95}
body.mob #knob{width:58px;height:58px;margin:-29px 0 0 -29px}
body.mob #jumpBtn{display:block;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:84px;height:84px;font-size:16px}
body.mob #actBtn{left:auto;right:calc(env(safe-area-inset-right,0px) + 16px);transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 124px);max-width:58vw;font-size:15px;padding:10px 14px;border-radius:20px;white-space:normal;line-height:1.15;text-align:left;animation:none;min-height:52px}
body.mob #buildBar{bottom:calc(env(safe-area-inset-bottom,0px) + 124px)}
body.mob.dlg-open #joy,body.mob.dlg-open #jumpBtn,body.mob.dlg-open #actBtn{display:none!important}
/* diálogo como painel inferior */
body.mob #dialog{left:8px;right:8px;width:auto;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:22px;padding:14px 16px}
body.mob #dBtns .pill{min-height:46px;font-size:16px;flex:1 1 auto}
/* painéis: inferior no vertical, lateral no horizontal */
body.mob .mh{display:inline-flex;align-items:center;justify-content:center;height:40px;border:0;border-radius:12px;background:var(--chip);font-weight:800;font-size:14px;padding:0 10px}
body.mob #mSize{width:40px;font-size:18px;padding:0}
body.mob:not(.closeup-open) #mPeek{display:none}
body.mob.land #mPeek,body.mob.land #mSize{display:none}
body.port #modal .sheet,body.port #modal .sheet.ward,body.port #modal .sheet.wide{left:6px;right:6px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);height:52vh;border-radius:24px 24px 18px 18px;transition:height .3s ease}
body.port.closeup-open #modal .sheet{height:50vh}
body.port #modal .sheet.full{height:calc(100vh - env(safe-area-inset-top,0px) - 70px)!important}
body.port #modal .sheet.peek{height:auto!important;max-height:30vh}
body.port #modal .sheet.peek #mBody > :not(.wdet){display:none}
body.port #modal .sheet.peek #mBody{padding-top:6px}
body.port #modal header{padding:10px 10px 8px 16px}
body.mob #modal h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.land #modal .sheet,body.land #modal .sheet.ward,body.land #modal .sheet.wide{top:calc(env(safe-area-inset-top,0px) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 6px);left:auto;width:min(56vw,520px);height:auto}
body.land.closeup-open #modal .sheet{width:min(50vw,480px)}
body.mob #mBody{padding:10px 12px 16px;overscroll-behavior:contain}
body.mob .wgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
body.mob .wtabs .tab{min-height:40px}
body.mob .wdet{top:-10px}
body.mob .wdet .ac .pill{min-height:40px}
body.mob .whead .wprog{display:none}
body.mob.modal-open #mTop{display:none}
/* ferramentas da prova */
body.port #wardTools{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto}
body.land #wardTools{left:calc((100vw - min(50vw,480px)) / 2);top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
body.mob .wtb{width:46px;height:46px;font-size:20px}
/* menu rápido */
.qbal{display:flex;gap:8px;font-weight:800;font-size:16px;margin-bottom:10px}
.qbal span{background:var(--chip);border-radius:12px;padding:4px 12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.qi{border:4px solid #fff;border-radius:22px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line),0 4px 0 rgba(90,42,122,.14);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.qi span{font-size:34px}
.qi b{font-size:13.5px;line-height:1.1}
/* desafios e mapa no celular */
body.mob #edu{padding:8px;align-items:flex-end}
body.mob #edu .ebox{max-height:calc(100vh - 16px)}
body.mob #edu .eopt{min-height:62px}
body.land #edu{align-items:center}
body.land #edu .evis{font-size:34px;margin:0 0 4px}
body.land #edu .eq{margin-bottom:8px}
body.mob #regionName{display:none}
body.mob #banner{display:none}
/* cidade, tesouros e pets */
#reveal{position:fixed;inset:0;z-index:46;display:grid;place-items:center;background:rgba(40,20,70,.55);opacity:0;transition:opacity .3s;padding:16px}
#reveal.on{opacity:1}
#reveal .rv{position:relative;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center;background:var(--card-solid);border:5px solid #fff;border-radius:30px;padding:clamp(10px,2.4vh,18px) 18px clamp(12px,2.4vh,20px);box-shadow:0 0 0 4px var(--rc),0 0 60px var(--rc),0 10px 0 rgba(0,0,0,.2);overflow:hidden;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
#reveal .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,0) 0 12deg,rgba(255,220,120,.22) 12deg 24deg);animation:spin 8s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#reveal .rv > *{position:relative}
#reveal h2{margin:0;font-family:'Fredoka','Baloo 2',system-ui;font-size:clamp(26px,5.6vh,44px);color:var(--rc);text-shadow:0 3px 0 #fff}
#reveal .rsub{margin:0;font-weight:800;color:var(--soft)}
#reveal .rth{width:min(190px,30vh);height:min(190px,30vh);margin:6px auto;border-radius:24px;background:radial-gradient(circle,#fff 0,#ffe8f5 70%);box-shadow:0 0 0 4px #fff,0 0 24px var(--rc);display:grid;place-items:center;overflow:hidden}
#reveal .rth img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s}
#reveal .remo{font-size:90px}
#reveal .rname{display:block;font-family:'Fredoka','Baloo 2',system-ui;font-size:clamp(17px,3vh,23px);margin-top:4px}
#reveal .rrar{display:inline-block;margin:6px 0;padding:2px 12px;border-radius:999px;background:var(--rc);color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.25)}
#reveal .rwhere{margin:4px 0 clamp(6px,1.4vh,12px);font-weight:700;color:var(--soft)}
#reveal .pill{font-size:18px;padding:10px 26px}
#cart{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 150px);padding:8px 14px;font-weight:700;font-size:14px;z-index:5;min-width:160px}
#cart b{display:block;color:var(--pink);margin-bottom:2px}
#cart .ok{color:#2b8a3e;text-decoration:line-through}
#cart .go{color:#2b8a3e;font-weight:800;margin-top:3px}
.kit{text-align:center}
.kprog{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.kprog span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.kprog span.ok{background:#3dd68c}
.kprog span.cur{background:#ffd43b;box-shadow:0 0 0 3px rgba(255,212,59,.35)}
.kstack{min-height:64px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;font-size:40px;background:var(--chip);border-radius:20px;padding:6px;margin-bottom:10px}
.kstack small{font-size:14px;color:var(--soft);font-weight:700}
.kq{font-size:20px;font-weight:800;margin:0 0 10px}
.kvis{font-size:42px;margin-bottom:8px}
.kopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kopt{border:0;border-radius:20px;padding:10px 8px;min-height:92px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line),0 4px 0 rgba(90,42,122,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kopt span{font-size:42px;line-height:1}
.kopt small{font-weight:800;font-size:14px}
.kopt.big{min-height:130px;font-size:60px}
.kopt.no{opacity:.4;animation:shake .35s}
.kmsg{min-height:24px;font-weight:800;color:var(--soft);margin:10px 0 0}
.petacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;margin:0 0 12px}
.pa{border:0;border-radius:18px;padding:8px 4px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line),0 3px 0 rgba(90,42,122,.14);display:flex;flex-direction:column;align-items:center}
.pa span{font-size:28px}
.pa small{font-weight:800;font-size:12px}
.wc.rar-especial{box-shadow:0 0 0 2px rgba(77,171,247,.45),0 5px 0 rgba(90,42,122,.14)}
.wc.rar-epico{box-shadow:0 0 0 3px rgba(156,54,181,.55),0 0 14px rgba(156,54,181,.35),0 5px 0 rgba(90,42,122,.14)}
.wc.rar-especial .rr{background:linear-gradient(135deg,#74c0fc,#a5d8ff)}
.wc.rar-epico .rr{background:linear-gradient(135deg,#9c36b5,#e599f7);color:#fff}
.rar-epico .th::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 62%);background-size:260% 100%;animation:shine 2.6s ease-in-out infinite;pointer-events:none}
/* viagem e universo */
#travel{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff 0,var(--tc,#ff8cc6) 70%);opacity:0;transition:opacity .4s;pointer-events:none}
#travel.on{opacity:1;pointer-events:auto}
#travel .tv{text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.18);font-family:'Fredoka','Baloo 2',system-ui,sans-serif}
#travel .veh{font-size:96px;animation:fly 1.6s ease-in-out forwards}
#travel b{display:block;font-size:30px}
#travel span{display:block;font-size:22px;font-weight:700;margin-top:4px}
#travel .trail{letter-spacing:10px;font-size:20px;opacity:.85;animation:twinkle .6s infinite alternate}
@keyframes fly{0%{transform:translate(-60vw,30px) rotate(-12deg)}50%{transform:translate(0,-10px) rotate(6deg) scale(1.15)}100%{transform:translate(60vw,-40px) rotate(-8deg)}}
@keyframes twinkle{to{opacity:.3}}
.uni{position:relative;width:100%;max-width:640px;margin-left:auto!important;margin-right:auto!important;aspect-ratio:1/1.05;border-radius:24px;overflow:hidden;margin:8px 0 12px;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.7) 0 2px,transparent 3px) 0 0/40px 40px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px) 0 0/34px 34px,linear-gradient(180deg,#5b3fa6 0%,#a66be0 35%,#ff9ccc 70%,#ffd6ea 100%);box-shadow:inset 0 0 0 4px #fff,0 6px 0 rgba(90,42,122,.18)}
.uni svg{position:absolute;inset:0;width:100%;height:100%}
.uni line{stroke:rgba(255,255,255,.45);stroke-width:.8;stroke-dasharray:1.6 1.4;stroke-linecap:round}
.uni line.on{stroke:#fff;stroke-width:1.1}
.isl{position:absolute;transform:translate(-50%,-50%);width:10.5%;aspect-ratio:1;min-width:46px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#fff 0,var(--ic) 70%);box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,255,255,.5);display:grid;place-items:center;padding:0;transition:transform .15s}
.isl:hover{transform:translate(-50%,-50%) scale(1.08)}
.isl .ie{font-size:clamp(20px,4.2vw,30px)}
.isl .in{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;white-space:nowrap;font-size:clamp(9px,1.7vw,12px);font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(60,20,90,.9),0 0 6px rgba(60,20,90,.6)}
.isl .il,.isl .ip{position:absolute;right:-8px;top:-8px;background:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 5px;color:#7a3aa8;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.isl .ihere{position:absolute;left:-10px;top:-14px;font-size:20px;animation:bob 1s ease-in-out infinite}
.isl.lock{filter:grayscale(1) brightness(.92);opacity:.85}
.isl.new{animation:newpulse 1.6s ease-in-out infinite}
@keyframes newpulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 8px rgba(255,255,255,.35)}}
.isl.sel{box-shadow:0 0 0 4px #ffd43b,0 4px 0 rgba(0,0,0,.18);z-index:2}
.isl.here{border-color:#ffd43b}
.ufav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.ufav .pill{padding:4px 10px;font-size:13px}
.wcard{display:grid;grid-template-columns:1fr 150px;gap:10px;border:4px solid #fff;border-radius:22px;padding:10px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line),0 6px 0 rgba(90,42,122,.14)}
.wcard .wch{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.wcard .wch .ie{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#fff 0,var(--ic) 75%);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.wcard .wch div{flex:1;line-height:1.15}
.wcard .wch b{font-family:'Fredoka','Baloo 2',system-ui;font-size:19px;display:block}
.wcard .wch small{color:var(--soft);font-weight:700}
.wcard .fvw{border:0;background:var(--chip);border-radius:50%;width:38px;height:38px;font-size:18px;filter:grayscale(1);opacity:.6}
.wcard .fvw.on{filter:none;opacity:1}
.wcard .wcb small{display:block;margin:4px 0;color:var(--soft);font-weight:700;font-size:12.5px}
.wcard .how{margin:4px 0 8px;font-weight:700;font-size:14px}
.wcard .how i{color:var(--pink);font-style:normal}
.wcard .wmini{width:150px;height:150px;border-radius:16px;align-self:start}
@media (max-width:520px){.wcard{grid-template-columns:1fr}.wcard .wmini{width:100%;height:auto}}
/* estilo fashion colecionável (guarda-roupa, coleções e pacotes) */
#modal .sheet.ward{background:radial-gradient(circle at 12px 12px,rgba(255,95,168,.09) 3px,transparent 4px) 0 0/28px 28px,radial-gradient(circle at 26px 22px,rgba(177,151,252,.12) 2px,transparent 3px) 0 0/28px 28px,var(--card-solid)}
#modal .sheet.ward header{background:linear-gradient(100deg,#ff5fa8 0%,#ff8a5c 40%,#b06ad9 100%);position:relative;overflow:hidden}
#modal .sheet.ward header::after{content:"✦ ✧ ✦";position:absolute;right:62px;top:8px;color:rgba(255,255,255,.75);font-size:16px;letter-spacing:6px}
#modal .sheet.ward h2,.wc .nm,.wdet b,.colc b,.wq b,.lk b,.pk .hd{font-family:'Fredoka','Baloo 2',ui-rounded,system-ui,sans-serif}
#modal .sheet.ward h2{font-weight:700;letter-spacing:.2px}
.wtabs{gap:7px}
.wtabs .tab{border-radius:999px;padding:7px 14px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 rgba(90,42,122,.12);font-weight:700}
.wtabs .tab.on{background:linear-gradient(135deg,#ff5fa8,#b06ad9);color:#fff;box-shadow:0 3px 0 #9c3a8a}
.wc{border:4px solid #fff;border-radius:22px;background:var(--card-solid);box-shadow:0 0 0 2px var(--line),0 5px 0 rgba(90,42,122,.14);padding:5px 5px 8px}
.wc:hover{transform:translateY(-3px) rotate(-1.2deg)}
.wc.sel{transform:scale(1.05) rotate(1deg)}
.wc .th::before,.wdet .th::before,.mi::before,.pk .sth::before,.it .sth::before{content:"";position:absolute;inset:0;background:var(--cg,linear-gradient(135deg,#ffd6ea,#e5dbff));opacity:.45}
.wc .th::after{border-radius:inherit}
.wc .th img,.wdet .th img,.mi img,.sth img{position:relative;z-index:1}
.wc .th{background:#fff;border-radius:17px}
.wc .nm{font-weight:600;font-size:13px}
.wc .rr{top:7px;bottom:auto;right:6px;left:auto;font-size:10.5px;font-weight:800;background:linear-gradient(135deg,#ffd43b,#ff8cc6);color:#5a2a7a;padding:1px 7px;border-radius:999px;box-shadow:0 2px 0 rgba(90,42,122,.2);z-index:2}
.wc.rar-lendario .rr{background:linear-gradient(90deg,#ff6b6b,#ffd43b,#69db7c,#4dabf7,#b197fc);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.wc .lk,.wc .nw,.wc .fv{z-index:2}
.wc.eq{box-shadow:0 0 0 3px #ff5fa8,0 5px 0 #c23d7f}
.wc.st-ready{box-shadow:0 0 0 3px #ffc83d,0 5px 0 #c9921a}
.wdet{border:4px solid #fff;box-shadow:0 0 0 2px var(--line),0 5px 0 rgba(90,42,122,.14)}
.wdet .th{background:#fff}
.colc{position:relative;border:4px solid #fff;border-radius:22px;box-shadow:0 0 0 2px var(--line),0 6px 0 rgba(90,42,122,.14);background:var(--card-solid);overflow:visible;margin-top:10px}
.colc .lid{position:absolute;left:-4px;right:-4px;top:-10px;height:22px;border-radius:14px 14px 6px 6px;background:var(--cg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.colc .ch{position:relative;background:var(--cg);border-radius:16px 16px 0 0;padding:16px 12px 10px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.colc .ch .ce{font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.colc .ch .cn{flex:1;line-height:1}
.colc .ch .cn small{display:block;font-size:11px;font-weight:800;opacity:.9;text-transform:none}
.colc .ch .cn b{font-size:18px}
.colc .ch .cp{background:rgba(255,255,255,.9);color:#7a3aa8;font-weight:800;border-radius:999px;padding:2px 10px;text-shadow:none}
.colc.done .ch .md{font-size:26px}
.cmini{gap:6px}
.mi{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #fff,0 2px 0 rgba(90,42,122,.2)}
.it .sth,.pk .sth{position:relative;display:block;overflow:hidden;width:76px;height:76px;border-radius:18px;background:#fff;box-shadow:0 0 0 3px #fff,0 3px 0 rgba(90,42,122,.14)}
.it .sth img,.pk .sth img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s}
.pk{border:4px solid #fff;box-shadow:0 0 0 2px var(--line),0 6px 0 rgba(90,42,122,.14);border-radius:22px}
.pk .hd{display:flex;align-items:center;gap:8px}
.pk .hd small{margin-left:auto;background:rgba(255,255,255,.9);color:#7a3aa8;border-radius:999px;padding:1px 10px;font-size:12px;text-shadow:none}
.pkitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin:6px 0 10px}
.pki{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pki small{font-size:11.5px;font-weight:700;line-height:1.1}
.pki .sth{width:70px;height:70px}
.pki .sth i{position:relative;z-index:1;display:grid;place-items:center;height:100%;font-style:normal;font-size:32px}
/* guarda-roupa encantado */
:root{--wc-bg:linear-gradient(180deg,#ffffff,#fff0f8);--th-bg:radial-gradient(circle at 50% 38%,#ffffff 0,#ffe3f3 58%,#efd9ff 100%);--det-bg:linear-gradient(135deg,#fff0f8,#f3e8ff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wc-bg:linear-gradient(180deg,#43275e,#3a2152);--th-bg:radial-gradient(circle at 50% 38%,#6a4a8a 0,#4e2f6e 60%,#3e2559 100%);--det-bg:linear-gradient(135deg,#4e2f6e,#3e2559)}}
:root[data-theme="dark"]{--wc-bg:linear-gradient(180deg,#43275e,#3a2152);--th-bg:radial-gradient(circle at 50% 38%,#6a4a8a 0,#4e2f6e 60%,#3e2559 100%);--det-bg:linear-gradient(135deg,#4e2f6e,#3e2559)}
#modal .sheet.ward{width:min(520px,calc(100vw - 24px));background:linear-gradient(180deg,var(--card-solid),var(--card-solid))}
#modal .sheet.ward header{background:linear-gradient(90deg,#ff5fa8,#b06ad9);border-bottom:0}
#modal .sheet.ward h2{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
@media (max-width:700px){#modal .sheet.ward{height:56vh}body.modal-open .tl,body.modal-open .tr{display:none}}
.whead{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.wbal{display:flex;gap:8px;font-weight:800;font-size:16px}
.wbal span{background:var(--chip);border-radius:12px;padding:2px 10px}
.wprog small{display:block;margin-top:4px;color:var(--soft);font-weight:700;font-size:12px}
.wtabs .tab{font-size:14px;padding:7px 12px}
.dotn{display:inline-block;background:#ff5fa8;color:#fff;border-radius:10px;padding:0 6px;font-size:11px;line-height:17px;margin-left:2px}
.tab.on .dotn{background:#fff;color:#ff5fa8}
.wfilt{display:flex;gap:6px;margin:0 0 8px}
.wfilt .pill{padding:4px 12px;font-size:13px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.wc{position:relative;border-radius:20px;background:var(--wc-bg);border:3px solid var(--line);padding:5px 5px 7px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.wc:hover{transform:translateY(-2px)}
.wc .th,.wdet .th,.lk .th,.wqr .th,.mi{position:relative;display:block;overflow:hidden;background:var(--th-bg)}
.wc .th{width:100%;aspect-ratio:1;border-radius:15px}
.wc img,.wdet img,.lk img,.wqr img,.mi img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .35s}
img.on{opacity:1!important}
.wc.st-lock .th img{filter:grayscale(.35) brightness(1.04);opacity:.72!important}
.wc .lk{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;background:var(--card-solid);display:grid;place-items:center;font-size:14px;box-shadow:0 2px 0 rgba(90,42,122,.2)}
.wc .nw{position:absolute;top:30px;right:7px;background:#ff5fa8;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;animation:pop 1s ease 2}
.wc .rr{position:absolute;top:34px;right:8px;font-size:15px}
.wc .nm{font-weight:800;font-size:12.5px;line-height:1.1;text-align:center;margin-top:5px;min-height:28px;display:flex;align-items:center;justify-content:center}
.wc .tg{font-size:12px;font-weight:800;color:var(--soft);margin-top:2px;text-align:center}
.wc .fv{position:absolute;bottom:4px;left:4px;width:28px;height:28px;border:0;border-radius:50%;background:var(--card-solid);color:#d6c2df;font-size:15px;line-height:1;box-shadow:0 2px 0 rgba(90,42,122,.15)}
.wc .fv.on{color:#ff5fa8}
.wc.eq{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,95,168,.28)}
.wc.eq .tg{color:var(--pink)}
.wc.st-ready{border-color:var(--gold);animation:ready 1.4s ease-in-out infinite}
.wc.st-ready .tg{color:#c9921a}
@keyframes ready{50%{box-shadow:0 0 0 4px rgba(255,200,61,.45),0 0 18px rgba(255,200,61,.6)}}
.wc.try{border-style:dashed;border-color:#b197fc}
.wc.sel{transform:scale(1.04)}
.wc.rar-raro{box-shadow:0 0 0 2px rgba(177,151,252,.35),0 0 12px rgba(177,151,252,.35)}
.rar-lendario .th::after,.rar-raro .th::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 48%,transparent 62%);background-size:260% 100%;animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.rar-lendario .th{box-shadow:inset 0 0 0 3px #ffd43b}
@keyframes shine{from{background-position:160% 0}to{background-position:-120% 0}}
.wdet{display:flex;gap:10px;align-items:center;border-radius:18px;padding:8px;background:var(--det-bg);margin:0 0 10px;position:sticky;top:-12px;z-index:3;box-shadow:0 4px 0 rgba(90,42,122,.12);animation:popin .25s ease}
.wdet .th{width:78px;height:78px;flex:none;border-radius:14px}
.wdet .tx{flex:1;min-width:0;line-height:1.2}
.wdet b{font-size:16px;display:block}
.wdet p{margin:3px 0;font-size:13.5px;font-weight:700}
.wdet small{color:var(--soft);font-weight:700;font-size:12px;display:block}
.wdet .pg{font-style:normal;color:var(--pink)}
.wdet .ac{display:flex;flex-direction:column;gap:5px}
.wdet .ac .pill{padding:6px 10px;font-size:13px;white-space:nowrap}
.cols{display:grid;grid-template-columns:1fr;gap:10px}
.colc{border:2px solid var(--line);border-radius:18px;overflow:hidden}
.colc.done{border-color:#ffd43b}
.colc .ch{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);font-size:17px}
.colc .ch span:first-child{font-size:22px}
.colc .ch b{flex:1}
.colc .cb{padding:8px 10px 10px}
.colc .cb small{display:block;color:var(--soft);font-weight:700;font-size:12px;margin:3px 0}
.cmini{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}
.mi{width:42px;height:42px;border-radius:10px;cursor:pointer}
.mi.lk img{filter:grayscale(1);opacity:.45!important}
.lksave{border:2px dashed var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.lksave .row{margin-top:6px;flex-wrap:nowrap}
.lksave input{font-size:15px;padding:6px 10px}
.lkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.lk{border:2px solid var(--line);border-radius:18px;padding:6px;text-align:center;background:var(--wc-bg)}
.lk .th{width:100%;aspect-ratio:1;border-radius:14px}
.lk b{display:block;font-size:13px;margin:4px 0}
.lk .row{justify-content:center;gap:4px}
.lk .pill{padding:4px 9px;font-size:13px}
.wq{border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;background:var(--wc-bg)}
.wq.done{border-color:#3dd68c}
.wqh{display:flex;gap:8px;align-items:center;font-size:17px}
.wqh b{flex:1}
.wq p{margin:4px 0 6px;font-size:13.5px;font-weight:600;color:var(--soft)}
.wq ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.wq li{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
.wq li span:nth-child(2){flex:1}
.wq li .pill{padding:4px 10px;font-size:13px}
.wqr{display:flex;align-items:center;gap:8px;margin-top:8px}
.wqr .th{width:54px;height:54px;border-radius:12px;flex:none}
.wqr small{flex:1;font-weight:700}
#wardTools{position:fixed;z-index:21;display:flex;gap:8px;left:calc((100vw - 544px) / 2);transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@media (max-width:700px){#wardTools{left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto}.wtb{width:42px;height:42px;font-size:19px}}
.wtb{width:50px;height:50px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:22px;display:grid;place-items:center}
.wtb:active{transform:translateY(2px)}

function areaOf(x, z) {
  if (z > 1700) return 'w_cidade';
  if (z < -2500) {
    if (z < -3300) { const h2 = Math.round((x - 3000) / 80); return typeof HOME_ROOMS !== 'undefined' && HOME_ROOMS[h2] ? HOME_ROOMS[h2].area : 'main'; }
    const k = Math.round((x - 3000) / 80); return BUILDINGS[k] ? BUILDINGS[k].area : 'main';
  }
  if (z > 900) { const w = NEW_WORLDS[Math.round((x + 2000) / 400)]; return w ? w.area : 'main'; }
  if (x > 550 && z > 550) return 'quarto';
  if (z < -400) return 'castelo';
  if (x > 300) return 'nuvens';
  if (x < -300) return 'gelado';
  return 'main';
}

function W(id, n, slot, o) {
  const it = ITEMS[id] || (ITEMS[id] = {id, n, slot, price: 0, cur: 'c'});
  if (n) it.n = n;
  Object.assign(it, o);
  if (!it.cat) it.cat = SLOT_CAT[slot] || 'acessorios';
  if (it.un && it.un.type === 'coins') it.price = it.un.n; else it.price = 0;
  if (it.un && it.un.type === 'pack') it.pack = it.un.id; else if (wearSlot(slot)) delete it.pack;
  delete it.reward;
  return it;
}

// prateleira de parede com itens
BK.shelfWall = (x, z, rot, len, items) => {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; scene.add(g);
  put(g, box(len, 5, 0.9, '#ffffff'), 0, 2.5, 0);
  for (let r = 0; r < 3; r++) { put(g, box(len - 0.2, 0.14, 0.9, '#d9a46c'), 0, 1 + r * 1.4, 0.05);
    const n = Math.round(len / 1.1);
    for (let i = 0; i < n; i++) { const it = items((r * n + i)); it.position.set(-len / 2 + 0.6 + i * ((len - 1.2) / Math.max(1, n - 1)), 1.1 + r * 1.4, 0.15); g.add(it); } }
  const sw = Math.abs(Math.sin(rot)) > 0.5; addRect(x, z, sw ? 0.9 : len, sw ? len : 0.9, 5);
  return g;
};
// ---------- casa residencial detalhada ----------
function fancyHouse(g, o) {
  const w = o.w || 8, h = o.h || 5, d = o.d || 7, c = o.wall, roof = o.roof, trim = o.trim || '#ffffff';
  put(g, mesh(new THREE.BoxGeometry(w + 0.3, 0.8, d + 0.3), BK.tmat(BK.brick('#e8835a', '#f2c6a8'))), 0, 0.4, 0);
  put(g, mesh(new THREE.BoxGeometry(w, h - 0.8, d), BK.tmat(BK.siding(c, new THREE.Color(c).offsetHSL(0, 0, -0.06).getStyle()))), 0, 0.8 + (h - 0.8) / 2, 0);
  put(g, box(w + 0.3, 0.24, d + 0.3, trim), 0, 0.82, 0);
  put(g, box(w + 0.4, 0.34, d + 0.4, trim), 0, h, 0);
  [-1, 1].forEach(k => put(g, box(0.32, h, 0.32, trim), k * w / 2, h / 2, d / 2));
  BK.gable(g, w, d, h + 0.15, Math.min(3.4, w * 0.42), BK.tiles(roof, new THREE.Color(roof).offsetHSL(0, 0, -0.1).getStyle()), trim, {wall: c, roundWin: w >= 7});
  if (o.chimney !== false) BK.chimney(g, w * 0.28, h + 1.8, -d * 0.18);
  // porta, janelas, varandinha
  BK.door(g, 0, d / 2 + 0.04, {w: Math.min(1.8, w * 0.24), h: Math.min(2.8, h * 0.56), color: o.door || '#c2255c', frame: trim, mat: roof});
  const ww = Math.min(1.5, w * 0.19), wh = Math.min(1.5, h * 0.3);
  [-1, 1].forEach(k => BK.window(g, k * w * 0.3, h * 0.56, d / 2 + 0.04, ww, wh, {frame: trim, shutter: roof, flowers: '#ffffff'}));
  // telhadinho sobre a porta
  const tp = put(g, box(Math.min(3, w * 0.4), 0.16, 1.2, roof), 0, Math.min(2.8, h * 0.56) + 1.1, d / 2 + 0.6); tp.rotation.x = 0.3;
  [-1, 1].forEach(k => put(g, cyl(0.07, 0.07, Math.min(2.8, h * 0.56) + 0.9, 6, trim), k * Math.min(1.35, w * 0.18), (Math.min(2.8, h * 0.56) + 0.9) / 2, d / 2 + 1.1));
  BK.wallLamp(g, Math.min(1.6, w * 0.22), Math.min(2.8, h * 0.56) + 0.5, d / 2 + 0.06);
  // laterais com janela também
  [-1, 1].forEach(k => { const sg = new THREE.Group(); sg.position.set(k * (w / 2 + 0.02), 0, 0); sg.rotation.y = k * Math.PI / 2; g.add(sg); BK.window(sg, 0, h * 0.56, 0, ww, wh, {frame: trim}); });
  [-1, 1].forEach(k => BK.pot(g, k * (w * 0.42), d / 2 + 0.9, o.potColor));
  put(g, cyl(0.08, 0.08, h, 6, '#adb5bd'), -w / 2 + 0.25, h / 2, d / 2 + 0.2);
}

const todayTheme = () => FESTA_THEMES[Math.floor(Date.now() / 600000) % FESTA_THEMES.length];

const mmCanvas = $('minimap'), mmCtx = mmCanvas.getContext('2d');

const EMOJI_FONT = 'system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
function newCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function buildBase(area) {

  });

    REGIONS.filter(r => r.area === 'main').forEach(r => { x.beginPath(); x.arc(tx(r.x), tz(r.z), r.r * s, 0, TAU); x.stroke(); });

}

}

function rebuildMaps(full) {

  let fx0 = 0, fx1 = W, fy0 = 0, fy1 = H;
  if (r.width < W * 0.8) fx1 = r.left; else fy1 = r.top; // painel lateral (horizontal) ou inferior (vertical)
  fy0 = document.body.classList.contains('port') ? 66 : 10; // espaço das ferramentas da prova
  const fw = Math.max(80, fx1 - fx0), fhh = Math.max(80, fy1 - fy0);

  const needH = 5.0, needW = showPet ? 4.8 : 2.6;
  // câmera perto (menos coisas na frente) e o campo de visão se ajusta à área livre
  const dist = 6.6 * closeZoom;

  camera.setViewOffset(W, H, vOff.x, vOff.y, W, H);
  const cpos = tmpV.set(p.x + Math.sin(cy) * dist + rx * cxm, p.y + 2.6, p.z + Math.cos(cy) * dist + rz * cxm);

function liveMsg(m) {

  if (m.t === 'entrou') { livePeerAdd(m); banner('💞 ' + m.nome + ' entrou no reino!', 'Procure por ela para brincarem juntas'); return; }
  if (m.t === 'saiu') { livePeerDel(m.id); return; }
  if (m.t === 'pos') { const pr = LIVE.peers[m.id]; if (!pr) return; pr.area = m.area; pr.tx = m.x; pr.tz = m.z; pr.tyaw = m.yaw; pr.mov = m.mov; pr.last = gameTime; return; }
  if (m.t === 'look') { const pr = LIVE.peers[m.id]; if (pr) livePeerLook(pr, m.look); return; }
  if (m.t === 'gesto') { const pr = LIVE.peers[m.id]; if (pr) { pr.gesto = gameTime; popText(m.g === 'tchau' ? '👋' : '💖', pr.obj.group.position.clone().add(new THREE.Vector3(0, 4.6, 0)), '#e64980'); } return; }
  if (m.t === 'entregue') { sfx('buy'); return; }
  if (m.t === 'falhou') { toast('Ops! ' + m.motivo); return; }
  if (m.t === 'presente') return liveGiftIn(m);
  if (m.t === 'cheio') { toast('A sala está cheia agora.'); LIVE.on = false; }
}
function livePeerAdd(d) {
  if (LIVE.peers[d.id]) livePeerDel(d.id);
  const look = d.look && typeof d.look === 'object' ? d.look : defaultLook();
  let obj; try { obj = buildAvatar(look); } catch (e) { obj = buildAvatar(defaultLook()); }
  obj.group.position.set(d.x || 0, 0, d.z || 0); scene.add(obj.group);
  const name = label('👑 ' + d.nome, {scale: 0.75}); scene.add(name);
  const mark = label('💞', {bg: '#ffffff', size: 50, scale: 0.7}); scene.add(mark);
  const pr = {id: d.id, nome: d.nome, obj, name, mark, x: d.x || 0, z: d.z || 0, tx: d.x || 0, tz: d.z || 0, yaw: d.yaw || 0, tyaw: d.yaw || 0, area: d.area, last: gameTime};
  LIVE.peers[d.id] = pr;
  const it = interact({x: pr.x, z: pr.z, r: 3.6, area: '*', show: () => !!LIVE.peers[d.id] && pr.area === curArea, text: () => '💞 Falar com ' + pr.nome + ' (ao vivo!)', act: () => talkLive(pr)});
  Object.defineProperty(it, 'x', {get: () => pr.x}); Object.defineProperty(it, 'z', {get: () => pr.z});
  pr.it = it;
  hideStaticFriend(d.nome, true);
}
function livePeerLook(pr, look) {
  try { const o = buildAvatar(look && typeof look === 'object' ? look : defaultLook()); o.group.position.copy(pr.obj.group.position); o.group.rotation.y = pr.obj.group.rotation.y; scene.remove(pr.obj.group); scene.add(o.group); pr.obj = o; } catch (e) {}
}
function livePeerDel(id) {
  const pr = LIVE.peers[id]; if (!pr) return;
  scene.remove(pr.obj.group); scene.remove(pr.name); scene.remove(pr.mark);
  const k = interacts.indexOf(pr.it); if (k >= 0) interacts.splice(k, 1);
  delete LIVE.peers[id];
  hideStaticFriend(pr.nome, false);
  toast('👋 ' + pr.nome + ' saiu do jogo');
}
function livePeersOnline() { return Object.keys(LIVE.peers).length; }
function livePeerByName(n) { return Object.values(LIVE.peers).find(p => p.nome === n); }
function liveClearAll() { Object.keys(LIVE.peers).forEach(livePeerDel); }

onFrame((dt, t) => {
  if (!P) return;
  Object.values(LIVE.peers).forEach(pr => {
    const vis = pr.area === curArea;
    pr.obj.group.visible = vis; pr.name.visible = vis; pr.mark.visible = vis;
    if (!vis) return;
    const k = 1 - Math.exp(-dt * 9);
    pr.x += (pr.tx - pr.x) * k; pr.z += (pr.tz - pr.z) * k;
    const d = Math.atan2(Math.sin(pr.tyaw - pr.yaw), Math.cos(pr.tyaw - pr.yaw));
    pr.yaw += d * Math.min(1, dt * 7);
    const g = pr.obj.group, pa = pr.obj.parts;
    const vel = Math.hypot(pr.tx - pr.x, pr.tz - pr.z);
    g.position.set(pr.x, vel > 0.05 ? Math.abs(Math.sin(t * 9)) * 0.08 : Math.sin(t * 1.4) * 0.04, pr.z);
    g.rotation.y = pr.yaw + Math.PI;
    const s = pr.mov || vel > 0.08 ? Math.sin(t * 9) * 0.55 : 0;
    if (pa.legL) { pa.legL.rotation.x = s; pa.legR.rotation.x = -s; pa.armL.rotation.x = -s; pa.armR.rotation.x = s; }
    if (pa.armR && !pr.mov && vel < 0.05) pa.armR.rotation.z = Math.hypot(player.pos.x - pr.x, player.pos.z - pr.z) < 7 ? 0.3 + Math.sin(t * 6) * 0.3 : 0;
    pr.name.position.set(pr.x, 4.7, pr.z);
    pr.mark.position.set(pr.x, 5.6 + Math.sin(t * 3) * 0.12, pr.z);
    blink(pa, t + pr.x);
  });
});

// ---------- DIA, NOITE E CHUVA ----------
// Um "dia" dura 10 minutos: amanhecer, dia, tardinha, noite. Dá para travar nas configurações.
const SKY_TINT = [
  {t: 0.00, n: 'amanhecer', e: '🌅', c: '#ffc2a8', l: 0.72, s: 0.6, warm: '#ffd8a8'},
  {t: 0.12, n: 'manhã', e: '☀️', c: '#ffffff', l: 1.00, s: 1.0, warm: '#fff3e0'},
  {t: 0.50, n: 'tardinha', e: '🌇', c: '#ffd0a0', l: 0.86, s: 0.8, warm: '#ffc078'},
  {t: 0.68, n: 'pôr do sol', e: '🌆', c: '#ff9a76', l: 0.62, s: 0.5, warm: '#ff922b'},
  {t: 0.80, n: 'noite', e: '🌙', c: '#4a4a8a', l: 0.38, s: 0.18, warm: '#9ab8ff'},
  {t: 0.97, n: 'amanhecer', e: '🌅', c: '#ffc2a8', l: 0.72, s: 0.6, warm: '#ffd8a8'}];
const DAY_SECONDS = 600;
const WEATHER = {t: 0.14, mode: 'auto', rain: 0, nextRain: 150 + rnd() * 240, bow: 0, phase: 'manhã'};
const hemiBase = hemi.intensity, sunBase = sun.intensity;
const skyBase = new THREE.Color(), tintCol = new THREE.Color();
function weatherSetting() { P.weather = P.weather || 'auto'; return P.weather; }
function tintNow() {
  const t = WEATHER.t;
  let a = SKY_TINT[0], b = SKY_TINT[1];
  for (let i = 0; i < SKY_TINT.length - 1; i++) if (t >= SKY_TINT[i].t && t < SKY_TINT[i + 1].t) { a = SKY_TINT[i]; b = SKY_TINT[i + 1]; }
  const k = (t - a.t) / Math.max(0.0001, b.t - a.t);
  return {c: new THREE.Color(a.c).lerp(new THREE.Color(b.c), k), l: a.l + (b.l - a.l) * k, s: a.s + (b.s - a.s) * k,
    warm: new THREE.Color(a.warm).lerp(new THREE.Color(b.warm), k), nome: k < 0.5 ? a.n : b.n, e: k < 0.5 ? a.e : b.e};
}
const isOutside = () => !(curArea === 'quarto' || curArea === 'castelo' || curArea.slice(0, 3) === 'in_');
// estrelas da noite
const starField = (function () {
  const g = new THREE.BufferGeometry(), n = 420, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = rnd() * TAU, e = 0.18 + rnd() * 1.1, r = 300;
    pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r; }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({color: 0xffffff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0}));
  p.renderOrder = -1; scene.add(p); return p;
})();
// lua
const moon = (function () {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.SphereGeometry(10, 18, 14), new THREE.MeshBasicMaterial({color: 0xfff6d0, transparent: true, opacity: 0}));
  g.add(m); scene.add(g); g.userData.m = m; return g;
})();
// chuva: gotas que seguem a câmera
const rainDrops = (function () {
  const n = 700, g = new THREE.BufferGeometry(), pos = new Float32Array(n * 6), spd = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (rnd() - .5) * 64, y = rnd() * 34, z = (rnd() - .5) * 64;
    pos[i * 6] = x; pos[i * 6 + 1] = y; pos[i * 6 + 2] = z;
    pos[i * 6 + 3] = x; pos[i * 6 + 4] = y - 2.2; pos[i * 6 + 5] = z;
    spd[i] = 26 + rnd() * 20;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color: 0x3f7fc4, transparent: true, opacity: 0}));
  p.visible = false; scene.add(p); p.userData.spd = spd; return p;
})();
// poças que aparecem com a chuva
const puddles = (function () {
  const g = new THREE.Group(); scene.add(g);
  const mat2 = new THREE.MeshPhongMaterial({color: 0xbfe6ff, transparent: true, opacity: 0, shininess: 90});
  for (let i = 0; i < 14; i++) { const m = new THREE.Mesh(new THREE.CircleGeometry(1.2 + rnd() * 1.6, 18), mat2); m.rotation.x = -Math.PI / 2; g.add(m); }
  g.userData.mat = mat2; return g;
})();
// arco-íris depois da chuva
const skyBow = (function () {
  const g = new THREE.Group(); g.visible = false; scene.add(g);
  ['#ff6b6b', '#ff922b', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'].forEach((c, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(70 - i * 4, 2, 8, 40, Math.PI), new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: 0.55, side: THREE.DoubleSide}));
    g.add(m);
  });
  return g;
})();
function startRain(dur) { WEATHER.rain = dur || 50 + rnd() * 40; rainDrops.visible = true; if (isOutside()) toast('🌧️ Começou a chover!'); }
function stopRain() { WEATHER.rain = 0; WEATHER.bow = 26; if (isOutside()) { toast('🌈 A chuva passou!'); skyBow.visible = true; } }
// aplica tudo a cada quadro
onFrame((dt, t) => {
  const modo = P ? weatherSetting() : 'auto';
  if (modo === 'auto') WEATHER.t = (WEATHER.t + dt / DAY_SECONDS) % 1;
  else if (modo === 'dia') WEATHER.t = 0.3;
  else if (modo === 'noite') WEATHER.t = 0.87;
  const ti = tintNow();
  WEATHER.phase = ti.nome;
  const fora = isOutside();
  // céu e luzes
  if (fora) {
    skyBase.set(AREAS[curArea].sky);
    tintCol.copy(skyBase).multiply(ti.c).lerp(ti.c, 0.25);
    if (WEATHER.rain > 0) tintCol.lerp(new THREE.Color('#8fa3b8'), 0.55);
    scene.background = tintCol; scene.fog.color.copy(tintCol);
    hemi.intensity = hemiBase * ti.l * (WEATHER.rain > 0 ? 0.82 : 1);
    sun.intensity = sunBase * ti.s * (WEATHER.rain > 0 ? 0.55 : 1);
    sun.color.copy(ti.warm);
    const ang = WEATHER.t * TAU - Math.PI / 2;
    sun.position.set(Math.cos(ang) * 60, Math.max(8, Math.sin(ang) * 70 + 22), 30);
  } else { hemi.intensity = hemiBase; sun.intensity = sunBase; sun.color.set(0xfff3e0); }
  // estrelas e lua
  const noite = Math.max(0, Math.min(1, (WEATHER.t - 0.72) / 0.12)) * (WEATHER.t < 0.98 ? 1 : 0);
  const starOp = fora ? noite * 0.95 : 0;
  starField.material.opacity += (starOp - starField.material.opacity) * Math.min(1, dt * 2);
  starField.visible = starField.material.opacity > 0.02;
  starField.position.set(camera.position.x, 0, camera.position.z);
  starField.rotation.y = t * 0.004;
  moon.userData.m.material.opacity += ((fora ? noite : 0) - moon.userData.m.material.opacity) * Math.min(1, dt * 2);
  moon.visible = moon.userData.m.material.opacity > 0.02;
  moon.position.set(camera.position.x - 120, 95, camera.position.z - 160);
  // chuva automática
  if (modo === 'auto') {
    if (WEATHER.rain > 0) { WEATHER.rain -= dt; if (WEATHER.rain <= 0) stopRain(); }
    else { WEATHER.nextRain -= dt; if (WEATHER.nextRain <= 0) { WEATHER.nextRain = 260 + rnd() * 320; startRain(); } }
  } else if (modo === 'chuva') { if (WEATHER.rain <= 0) startRain(99999); }
  else if (WEATHER.rain > 0) { WEATHER.rain = 0; }
  // gotas
  const chovendo = WEATHER.rain > 0 && fora;
  rainDrops.visible = chovendo;
  rainDrops.material.opacity += ((chovendo ? 0.85 : 0) - rainDrops.material.opacity) * Math.min(1, dt * 3);
  if (chovendo) {
    const arr = rainDrops.geometry.attributes.position.array, spd = rainDrops.userData.spd;
    for (let i = 0; i < spd.length; i++) {
      const d2 = spd[i] * dt;
      arr[i * 6 + 1] -= d2; arr[i * 6 + 4] -= d2;
      if (arr[i * 6 + 4] < 0) {
        const x = (rnd() - .5) * 64, y = 30 + rnd() * 8, z = (rnd() - .5) * 64;
        arr[i * 6] = x; arr[i * 6 + 1] = y; arr[i * 6 + 2] = z;
        arr[i * 6 + 3] = x; arr[i * 6 + 4] = y - 2.2; arr[i * 6 + 5] = z;
      }
    }
    rainDrops.geometry.attributes.position.needsUpdate = true;
    rainDrops.position.set(player.pos.x, 0, player.pos.z);
  }
  // poças
  const pm = puddles.userData.mat;
  pm.opacity += ((chovendo ? 0.5 : 0) - pm.opacity) * Math.min(1, dt * 0.8);
  puddles.visible = pm.opacity > 0.02;
  if (puddles.visible && puddles.children.length) {
    puddles.children.forEach((m, i) => { if (!m.userData.set || chovendo && rnd() < 0.002) { m.userData.set = 1; m.position.set(player.pos.x + (rnd() - .5) * 50, 0.06, player.pos.z + (rnd() - .5) * 50); } });
  }
  // arco-íris
  if (WEATHER.bow > 0) { WEATHER.bow -= dt; skyBow.visible = fora; skyBow.position.set(player.pos.x, 2, player.pos.z - 110); if (WEATHER.bow <= 0) skyBow.visible = false; }
});

function rideInfo(r) {

  if (r.price) return {buy: r.price, how: 'Compre por ' + r.price + ' moedas', e: '🪙'};
  if (r.un.type === 'stars') return {ready: (P.edu.stars || 0) >= r.un.n, prog: [P.edu.stars || 0, r.un.n], how: 'Junte ' + r.un.n + ' Estrelas do Saber', e: '⭐'};

}

// ---------- PRINCESAS AO VIVO NO MAPA ----------
// Onde está cada princesa conectada: no mapa daqui, no minimapa e nas ilhas do universo.
function peerRealm(area) {
  if (!area) return null;
  if (area === 'main' || area === 'quarto' || area === 'castelo' || area.slice(0, 3) === 'hm_') return 'reino';
  if (area.slice(0, 3) === 'in_') { const b = BUILDINGS.find(x => x.area === area); if (!b) return null; if (b.realm) return b.realm === 'main' ? 'reino' : b.realm; if (b.world) return b.world; if (b.noFacade) return 'reino'; return 'cidade'; }
  if (area === 'w_cidade') return 'cidade';
  if (area === 'nuvens' || area === 'gelado') return area;
  const w = NEW_WORLDS.find(x => x.area === area); return w ? w.id : null;
}
function peerPlaceName(area) {
  if (area && area.slice(0, 3) === 'in_') { const b = BUILDINGS.find(x => x.area === area); if (b) return 'dentro da loja ' + b.e + ' ' + b.n; }
  if (area && area.slice(0, 3) === 'hm_') return 'na Minha Casinha';
  const r = REALM_BY[peerRealm(area)]; return r ? 'em ' + r.e + ' ' + r.n : 'passeando por aí';
}
const livePeerList = () => Object.values(LIVE.peers || {});
// marcadores nos mapas do lugar atual
(function () {
  const old = drawMarkers;
  drawMarkers = function (x, tx, tz, area, big) {
    old(x, tx, tz, area, big);
    livePeerList().forEach(pr => {
      if (pr.area !== area) return;
      const px = tx(pr.x), pz = tz(pr.z), r = big ? 15 : 10, bob = Math.sin(gameTime * 4 + pr.x) * 2;
      x.save();
      x.fillStyle = 'rgba(255,212,59,.35)'; x.beginPath(); x.arc(px, pz, r + 5 + Math.sin(gameTime * 5) * 2, 0, TAU); x.fill();
      x.fillStyle = '#ffffff'; x.strokeStyle = '#ff5fa8'; x.lineWidth = 3; x.beginPath(); x.arc(px, pz + bob, r, 0, TAU); x.fill(); x.stroke();
      x.font = (big ? 18 : 12) + 'px ' + EMOJI_FONT; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('👑', px, pz + bob);
      x.font = '800 ' + (big ? 15 : 10) + 'px "Baloo 2", system-ui'; x.lineWidth = 4; x.strokeStyle = '#ffffff'; x.fillStyle = '#c2255c';
      x.strokeText(pr.nome, px, pz + bob - r - (big ? 10 : 7)); x.fillText(pr.nome, px, pz + bob - r - (big ? 10 : 7));
      x.restore();
    });
  };
})();
// faixa no topo do mapa dizendo onde cada princesa está
function livePeersBanner() {
  const L = livePeerList(); if (!L.length) return null;
  const el = h('<div class="peerbar"></div>');
  L.forEach(pr => el.appendChild(h(`<span>👑 <b>${esc(pr.nome)}</b> está ${pr.area === curArea ? 'aqui pertinho!' : esc(peerPlaceName(pr.area))}</span>`)));
  return el;
}
(function () {
  const old = openMap;
  openMap = function (tab, sel) {
    old(tab, sel);
    const decorate = () => {
      const body = $('mBody'); if (!body || $('modal').classList.contains('hidden')) return;
      const bar = livePeersBanner(); if (bar && !body.querySelector('.peerbar')) { const tabs = body.querySelector('.tabs'); if (tabs) tabs.after(bar); }
      // ilhas do universo com quem está lá
      body.querySelectorAll('.uni .isl').forEach(b => {
        const nome = b.querySelector('.in') ? b.querySelector('.in').textContent : '';
        const r = REALMS.find(x => x.n === nome); if (!r) return;
        const aqui = livePeerList().filter(pr => peerRealm(pr.area) === r.id);
        if (aqui.length && !b.querySelector('.ifr')) b.appendChild(h(`<span class="ifr">👑 ${esc(aqui.map(p => p.nome).join(', '))}</span>`));
      });
    };
    decorate();
    const mo = new MutationObserver(decorate); mo.observe($('mBody'), {childList: true});
    const prev = modalOnClose; modalOnClose = () => { mo.disconnect(); if (prev) prev(); };
  };
})();
// ---------- uma princesa por vez: se ela entrar em outro aparelho, este sai ----------
function liveKicked(m) {
  LIVE.kicked = true; LIVE.tries = 999;
  try { saveNow(); } catch (e) {}
  liveClearAll && liveClearAll();
  const el = h(`<div id="kicked"><div class="kb"><div class="kc">👑</div><h3>A ${esc(m.nome || 'princesa')} entrou em outro aparelho</h3><p>Só dá para jogar com a mesma princesa em um lugar de cada vez. Para continuar aqui, escolha a princesa de novo.</p><button class="pill main">Entendi</button></div></div>`);
  document.body.appendChild(el);
  el.querySelector('.pill').onclick = () => { location.reload(); };
}
window.__liveMsg = m => { if (m && m.t === 'expulso') return liveKicked(m); return liveMsg(m); };

})();
</script>
<script>try{if('serviceWorker' in navigator && location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}catch(e){}</script>
